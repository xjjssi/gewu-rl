  <rect x="21" y="13" width="6" height="6" rx="1" fill="#1e293b"/>
  <rect x="5" y="21" width="6" height="6" rx="1" fill="#1e293b"/>
  <rect x="13" y="21" width="6" height="6" rx="1" fill="#1e293b"/>
